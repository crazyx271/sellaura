<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#12141c">
  <meta name="robots" content="noindex">
  <title>Страница не найдена — AURA</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="page-root">
    <svg class="svg-defs" aria-hidden="true">
      <filter id="liquid-refract" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="7" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="22" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </svg>
    <div class="wallpaper" aria-hidden="true">
      <div class="blob blob-a"></div>
      <div class="blob blob-b"></div>
      <div class="blob blob-c"></div>
      <div class="blob blob-d"></div>
    </div>
    <div class="relative z-10 w-full max-w-[1280px] mx-auto px-4 sm:px-6 lg:px-8 py-6 md:py-8 flex flex-col gap-10">
      <a href="index.html" class="brand"><img src="assets/logo.svg" width="32" height="32" alt="" class="brand-mark">AURA</a>
      <main class="glass max-w-xl p-8 sm:p-10">
        <p class="meta text-text-3 relative z-10">404</p>
        <h1 class="text-4xl font-semibold text-tight mt-3 mb-4 relative z-10">Такой страницы нет</h1>
        <p class="text-text-2 mb-6 relative z-10">Проверьте адрес или вернитесь в витрину.</p>
        <a href="index.html" class="glass-btn px-5 py-2.5 text-sm">На главную</a>
      </main>
    </div>
  </div>
</body>
</html>
